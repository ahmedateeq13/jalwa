<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JALWA Admin Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#090504;
  color:#fff;
}

button,input,select{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* LOGIN */
.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:radial-gradient(circle at top,#4c1e0c,#090504 65%);
}

.login-box{
  width:100%;
  max-width:390px;
  padding:28px;
  border-radius:22px;
  background:#170a06;
  border:1px solid #b77822;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  color:#ffd56a;
  font-size:34px;
  font-weight:900;
  letter-spacing:6px;
  margin-bottom:5px;
}

.sub{
  text-align:center;
  color:#cdb184;
  font-size:12px;
  margin-bottom:25px;
}

.login-box h2{
  color:#ffd56a;
  margin-bottom:15px;
}

.input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #684017;
  background:#090504;
  color:#fff;
  outline:none;
}

.input:focus{
  border-color:#d39b3b;
}

.gold-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:linear-gradient(135deg,#d79a31,#8c4e0c);
  color:#fff;
  font-weight:bold;
}

/* ADMIN */
.admin{
  min-height:100vh;
  display:flex;
  background:#090504;
}

.sidebar{
  width:250px;
  min-height:100vh;
  background:#130805;
  border-right:1px solid #684017;
  padding:22px 15px;
  position:fixed;
  left:0;
  top:0;
}

.sidebar-logo{
  color:#ffd56a;
  font-size:27px;
  font-weight:900;
  letter-spacing:4px;
  text-align:center;
  margin-bottom:25px;
}

.menu-btn{
  width:100%;
  padding:13px;
  margin-bottom:8px;
  border:1px solid rgba(255,190,80,.15);
  border-radius:10px;
  background:#211006;
  color:#eac77f;
  text-align:left;
}

.menu-btn:hover,
.menu-btn.active{
  background:#6b2d0c;
  color:#ffd56a;
  border-color:#b77822;
}

.logout{
  margin-top:20px;
}

.main{
  width:100%;
  margin-left:250px;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.topbar h1{
  color:#ffd56a;
  font-size:25px;
}

.admin-name{
  color:#cdb184;
  font-size:13px;
}

/* CARDS */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  padding:20px;
  border-radius:16px;
  background:linear-gradient(145deg,#2a1007,#130805);
  border:1px solid rgba(255,190,80,.25);
}

.stat-title{
  color:#bfa77f;
  font-size:12px;
}

.stat-number{
  color:#ffd56a;
  font-size:27px;
  font-weight:900;
  margin-top:8px;
}

/* SECTIONS */
.panel{
  background:#170a06;
  border:1px solid rgba(255,190,80,.22);
  border-radius:16px;
  padding:18px;
  margin-bottom:20px;
}

.panel h2{
  color:#ffd56a;
  font-size:18px;
  margin-bottom:15px;
}

/* TABLE */
.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}

th,td{
  padding:12px;
  border-bottom:1px solid rgba(255,255,255,.07);
  text-align:left;
  font-size:12px;
}

th{
  color:#ffd56a;
  background:#211006;
}

td{
  color:#e5c997;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:10px;
  font-weight:bold;
}

.pending{
  background:#5c3b0c;
  color:#ffd56a;
}

.approved{
  background:#174b28;
  color:#8df0aa;
}

.rejected{
  background:#571d1d;
  color:#ff9999;
}

.action{
  padding:7px 9px;
  border:0;
  border-radius:7px;
  margin:2px;
  font-size:10px;
  font-weight:bold;
}

.approve{
  background:#286b3a;
  color:#fff;
}

.reject{
  background:#7a2929;
  color:#fff;
}

.block{
  background:#684017;
  color:#fff;
}

/* EMPTY */
.empty{
  padding:25px;
  text-align:center;
  color:#9f896b;
  font-size:13px;
}

/* RESPONSIVE */
@media(max-width:900px){

  .sidebar{
    width:210px;
  }

  .main{
    margin-left:210px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:650px){

  .sidebar{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .admin{
    display:block;
  }

  .main{
    margin-left:0;
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .topbar{
    display:block;
  }

  .admin-name{
    margin-top:7px;
  }

}
</style>
</head>

/* =========================
   SECTIONS
========================= */

function showSection(id,button){

  document
    .querySelectorAll(".section")
    .forEach(section => {
      section.classList.add("hidden");
    });

  document
    .getElementById(id)
    .classList.remove("hidden");


  document
    .querySelectorAll(".menu-btn")
    .forEach(btn => {
      btn.classList.remove("active");
    });

  button.classList.add("active");


  const titles = {
    dashboard:"Dashboard",
    users:"Users",
    deposits:"Deposits",
    withdrawals:"Withdrawals",
    transactions:"Transactions",
    notifications:"Notifications",
    settings:"Settings"
  };

  document.getElementById("pageTitle")
    .textContent = titles[id];


  if(id === "dashboard")
    loadDashboard();

  if(id === "users")
    loadUsers();

  if(id === "deposits")
    loadDeposits();

  if(id === "withdrawals")
    loadWithdrawals();

  if(id === "transactions")
    loadTransactions();

  if(id === "notifications")
    loadNotifications();

}


/* =========================
   REQUEST DATA
========================= */

async function getRequests(){

  const { data, error } =
    await db
      .from("requests")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if(error){

    console.error(
      "SUPABASE REQUEST ERROR:",
      error
    );

    alert("Requests load nahi ho sakin.");

    return [];
  }

  return data || [];
}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

  const { data: requests, error: requestError } =
    await db
      .from("requests")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if(requestError){

    console.error(
      "SUPABASE DASHBOARD ERROR:",
      requestError
    );

    alert("Dashboard data load nahi ho saka.");

    return;
  }

  const { count: usersCount, error: usersError } =
    await db
      .from("users")
      .select("id", {
        count: "exact",
        head: true
      });

  if(usersError){

    console.error(
      "SUPABASE USERS COUNT ERROR:",
      usersError
    );

  }

  const deposits =
    (requests || []).filter(r =>
      r.type === "Deposit" &&
      r.status === "PENDING"
    );

  const withdrawals =
    (requests || []).filter(r =>
      r.type === "Withdrawal" &&
      r.status === "PENDING"
    );

  document.getElementById("totalUsers")
    .textContent =
      usersCount || 0;

  document.getElementById("pendingDeposits")
    .textContent =
      deposits.length;

  document.getElementById("pendingWithdrawals")
    .textContent =
      withdrawals.length;

  document.getElementById("totalTransactions")
    .textContent =
      (requests || []).length;

  const recent =
    (requests || []).slice(0, 5);

  const box =
    document.getElementById("recentRequests");

  if(!recent.length){

    box.innerHTML =
      `<div class="empty">No requests yet.</div>`;

    return;
  }

  box.innerHTML = `
    <div class="table-wrap">
    <table>

      <tr>
        <th>Type</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Date</th>
      </tr>

      ${recent.map(r => `

        <tr>

          <td>${r.type || "-"}</td>

          <td>
            Rs ${Number(r.amount || 0).toLocaleString()}
          </td>

          <td>
            <span class="badge ${String(r.status || "").toLowerCase()}">
              ${r.status || "-"}
            </span>
          </td>

          <td>
            ${
              r.created_at
                ? new Date(r.created_at).toLocaleString()
                : "-"
            }
          </td>

        </tr>

      `).join("")}

    </table>
    </div>
  `;
}


/* =========================
   USERS
========================= */

async function loadUsers(){

  const box =
    document.getElementById("usersContent");

  const { data: users, error } =
    await db
      .from("users")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if(error){

    console.error(
      "SUPABASE USERS ERROR:",
      error
    );

    box.innerHTML =
      `<div class="empty">Users load nahi ho sake.</div>`;

    return;
  }

  if(!users || !users.length){

    box.innerHTML =
      `<div class="empty">No users found.</div>`;

    return;
  }

  box.innerHTML = `

    <div class="table-wrap">

    <table>

      <tr>
        <th>Name</th>
        <th>Phone</th>
        <th>Balance</th>
        <th>Referral</th>
        <th>Action</th>
      </tr>

      ${users.map(user => `

        <tr>

          <td>${user.name || "-"}</td>

          <td>${user.phone || "-"}</td>

          <td>
            Rs ${Number(user.balance || 0).toLocaleString()}
          </td>

          <td>${user.referral || "-"}</td>

          <td>
            <button
              class="action block"
              onclick="adjustBalance(${user.id})"
            >
              Balance
            </button>
          </td>

        </tr>

      `).join("")}

    </table>

    </div>
  `;
}


async function adjustBalance(userId){

  const amount =
    prompt("Enter new balance:");

  if(amount === null)
    return;

  const value =
    Number(amount);

  if(isNaN(value) || value < 0){

    alert("Invalid balance.");

    return;
  }

  const { data: user, error: getError } =
    await db
      .from("users")
      .select("*")
      .eq("id", userId)
      .maybeSingle();

  if(getError || !user){

    console.error(
      "GET USER ERROR:",
      getError
    );

    alert("User nahi mila.");

    return;
  }

  const { error: updateError } =
    await db
      .from("users")
      .update({
        balance: value
      })
      .eq("id", userId);

  if(updateError){

    console.error(
      "UPDATE BALANCE ERROR:",
      updateError
    );

    alert("Balance update nahi ho saka.");

    return;
  }

  loadUsers();
  loadDashboard();

  alert("Balance updated successfully.");
}

/* =========================

========================= */

          </td>

          </td>

              ${r.status || "-"}
            </span>
          </td>

          <td>
            ${
              r.created_at
              ? new Date(r.created_at).toLocaleString()
              : "-"
            }

              ? `

                <button

                  class="action reject"
                  onclick="rejectRequest(${r.id})"
                >

                </button>

              `
              : "-"
            }

        `;

      }).join("")}

    </table>

    </div>
  `;
}

/* =========================
   APPROVE REQUEST
========================= */

async function approveRequest(id){

  const { data: request, error: requestError } =
    await db
      .from("requests")
      .select("*")
      .eq("id", id)
      .maybeSingle();

  if(requestError || !request){

    console.error(
      "GET REQUEST ERROR:",
      requestError
    );

    alert("Request nahi mili.");
    return;
  }

  if(request.status !== "PENDING"){

    alert("Ye request already process ho chuki hai.");
    return;
  }

  const { data: user, error: userError } =
    await db
      .from("users")
      .select("*")
      .eq("id", request.user_id)
      .maybeSingle();

  if(userError || !user){

    console.error(
      "GET USER ERROR:",
      userError
    );

    alert("User nahi mila.");
    return;
  }

  const amount =
    Number(request.amount || 0);

  let newBalance =
    Number(user.balance || 0);

  /* =========================
     DEPOSIT
  ========================= */

  if(request.type === "Deposit"){

    newBalance =
      newBalance + amount;
  }

  /* =========================
     WITHDRAWAL
  ========================= */

  if(request.type === "Withdrawal"){

    if(newBalance < amount){

      alert(
        "User balance is insufficient for this withdrawal."
      );

      return;
    }

    newBalance =
      newBalance - amount;
  }

  /* =========================
     UPDATE USER BALANCE
  ========================= */

  const { error: balanceError } =
    await db
      .from("users")
      .update({
        balance: newBalance
      })
      .eq("id", user.id);

  if(balanceError){

    console.error(
      "BALANCE UPDATE ERROR:",
      balanceError
    );

    alert("Balance update nahi ho saka.");
    return;
  }

  /* =========================
     APPROVE REQUEST
  ========================= */

  const { error: approveError } =
    await db
      .from("requests")
      .update({
        status: "APPROVED"
      })
      .eq("id", id);

  if(approveError){

    console.error(
      "APPROVE REQUEST ERROR:",
      approveError
    );

    alert("Request approve nahi ho saki.");
    return;
  }

  /* =========================
     TRANSACTION
  ========================= */

  const { error: transactionError } =
    await db
      .from("transactions")
      .insert({

        user_id:
          request.user_id,

        type:
          request.type,

        amount:
          amount,

        status:
          "completed",

        description:
          request.type === "Deposit"
            ? "Deposit approved"
            : "Withdrawal approved"

      });

  if(transactionError){

    console.error(
      "TRANSACTION ERROR:",
      transactionError
    );

  }

  /* =========================
     REFRESH ADMIN PANEL
  ========================= */

  loadDashboard();
  loadDeposits();
  loadWithdrawals();
  loadTransactions();

  alert(
    request.type +
    " approved successfully."
  );
}

   REJECT REQUEST

async function rejectRequest(id){

  const { data: request, error: requestError } =
    await db
      .from("requests")
      .select("*")
      .eq("id", id)
      .maybeSingle();

  if(requestError || !request){

    console.error(
      "GET REQUEST ERROR:",
      requestError
    );

    alert("Request nahi mili.");
    return;
  }

  if(request.status !== "PENDING"){

    alert("Ye request already process ho chuki hai.");
    return;
  }

  const { error } =
    await db
      .from("requests")
      .update({
        status: "REJECTED"
      })
      .eq("id", id);

  if(error){

    console.error(
      "REJECT REQUEST ERROR:",
      error
    );

    alert("Request reject nahi ho saki.");
    return;
  }

  /* =========================
     REFRESH ADMIN PANEL
  ========================= */

  loadDashboard();
  loadDeposits();
  loadWithdrawals();

  alert(
    request.type +
    " rejected successfully."
  );
}

   TRANSACTIONS
========================= */

async function loadTransactions(){

  const box =
    document.getElementById("transactionsContent");

  const { data: transactions, error } =
    await db
      .from("transactions")
      .select("*")
      .order("created_at", {
        ascending: false
      });

  if(error){

    console.error(
      "SUPABASE TRANSACTIONS ERROR:",
      error
    );

    box.innerHTML =
      `<div class="empty">Transactions load nahi ho sakin.</div>`;

    return;
  }

  if(!transactions || !transactions.length){

    box.innerHTML =
      `<div class="empty">No transactions yet.</div>`;

    return;
  }

  box.innerHTML = `

    <div class="table-wrap">

    <table>

      <tr>
        <th>Type</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Description</th>
        <th>Date</th>
      </tr>

      ${transactions.map(t => `

        <tr>

          <td>
            ${t.type || "-"}
          </td>

          <td>
            Rs ${Number(t.amount || 0).toLocaleString()}
          </td>

          <td>
            <span class="badge ${String(t.status || "").toLowerCase()}">
              ${t.status || "-"}
            </span>
          </td>

          <td>
            ${t.description || "-"}
          </td>

          <td>
            ${
              t.created_at
              ? new Date(t.created_at).toLocaleString()
              : "-"
            }
          </td>

        </tr>

      `).join("")}

    </table>

    </div>
  `;
}

========================= */

function sendNotification(){

  const text =
    document
      .getElementById("notificationText")
      .value.trim();


  if(!text){

    alert("Write notification first.");

    return;
  }


  const list =
    JSON.parse(
      localStorage.getItem("jalwaNotifications") || "[]"
    );


  list.push({
    text:text,
    date:new Date().toLocaleString()
  });


  localStorage.setItem(
    "jalwaNotifications",
    JSON.stringify(list)
  );


  document.getElementById("notificationText")
    .value = "";


  loadNotifications();

  alert("Notification saved.");

}


function loadNotifications(){

  const list =
    JSON.parse(
      localStorage.getItem("jalwaNotifications") || "[]"
    );


  const box =
    document.getElementById("notificationList");


  if(!list.length){

    box.innerHTML =
      `<div class="empty">No notifications.</div>`;

    return;
  }


  box.innerHTML =
    list.slice().reverse().map(n => `

      <div class="panel">

        <div style="color:#ffe09a;">
          ${n.text}
        </div>

        <div style="font-size:10px;color:#9f896b;margin-top:6px;">
          ${n.date}
        </div>

      </div>

    `).join("");

}
